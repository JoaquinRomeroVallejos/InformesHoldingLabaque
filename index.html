function computeResultadoModulo(mod, mes, datos) {
  try {
    if (mod === 'ventas' && datos && datos.filas) return computeVentas(datos.filas, { cliente: 'Cliente', monto: 'Monto' });
    if (mod === 'deudores' && datos && datos.filas) return computeCartera(datos.filas, { cliente: 'Deudor', saldo: 'Saldo' }, lastDayOfMonth(mes), 'cliente');
  } catch (e) { console.warn('No se pudo calcular resultado de', mod, mes, e); }
  return null;
}

async function fetchAppData() {
  const [{ data: empresasRows }, { data: cierresRows }, { data: informesRows }, { data: modulosRows },
         { data: inversionesRows }, { data: participantesRows }, { data: aportesRows }] = await Promise.all([
    sb.from('empresas').select('*').order('orden'),
    sb.from('cierres').select('*'),
    sb.from('informes_gestion').select('*'),
    sb.from('modulos_datos').select('*'),
    sb.from('inversiones').select('*'),
    sb.from('inversion_participantes').select('*'),
    sb.from('inversion_aportes').select('*')
  ]);
  const empresas = (empresasRows || []).map(e => {
    const emp = {
      id: e.id, nombre: e.nombre, cuit: e.cuit, tipoNegocio: e.tipo_negocio,
      nota: e.nota || undefined,
      logo: e.id === 'mec' ? LOGO_MEC : (e.logo_base64 || undefined),
      cierres: (cierresRows || []).filter(c => c.empresa_id === e.id).map(c => ({
        mes: c.mes, ingresos: c.ingresos, egresos: c.egresos, activo: c.activo, pasivo: c.pasivo,
        patrimonio: c.patrimonio, liquidez: c.liquidez, endeudamiento: c.endeudamiento,
        estado: c.estado, resumen: c.resumen
      })),
      modulos: blankModulos()
    };
    const ig = (informesRows || []).find(i => i.empresa_id === e.id);
    if (ig) emp.informeGestion = ig.data;
    (modulosRows || []).filter(m => m.empresa_id === e.id).forEach(m => {
      if (!emp.modulos[m.modulo]) return;
      const resultado = computeResultadoModulo(m.modulo, m.mes, m.datos);
      emp.modulos[m.modulo].datos[m.mes] = Object.assign({}, m.datos, resultado ? { resultado } : {});
    });
    ensureNegocio(emp);
    return emp;
  });
  const inversiones = (inversionesRows || []).map(inv => ({
    id: inv.id, nombre: inv.nombre, tipo: inv.tipo, descripcion: inv.descripcion,
    participantes: (participantesRows || []).filter(p => p.inversion_id === inv.id).map(p => ({
      id: p.id, empresaId: p.empresa_id, empresaNombre: p.empresa_nombre, pct: Number(p.pct), presupuestoUSD: Number(p.presupuesto_usd),
      aportes: (aportesRows || []).filter(a => a.participante_id === p.id).map(a => ({
        mes: a.mes, rubro: a.rubro, ars: a.ars != null ? Number(a.ars) : undefined, usd: a.usd != null ? Number(a.usd) : undefined
      }))
    }))
  }));
  return { empresas, inversiones };
}

async function afterLogin() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { showLogin(); return; }
  const { data: profile, error: profileErr } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (profileErr || !profile) {
    showLoginError('No se encontró un perfil asociado a este usuario. Contactá al administrador.');
    await sb.auth.signOut();
    return;
  }
  state.profile = profile;
  state.role = profile.rol === 'auditor' ? 'auditor' : 'socio';
  state.esAdmin = !!profile.es_admin;
  try {
    state.data = await fetchAppData();
  } catch (e) {
    console.error('Error cargando datos de Supabase', e);
    showLoginError('No se pudieron cargar los datos. Intentá de nuevo más tarde.');
    return;
  }
  if (!state.selectedId && state.data.empresas.length) state.selectedId = state.data.empresas[0].id;
  state.view = 'empresas';
  state.tab = 'resumen';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  renderAll();
}

function showLogin() {
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = '';
  const submitBtn = document.getElementById('loginSubmitBtn');
  if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Ingresar'; }
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  if (el) { el.textContent = msg; el.style.display = msg ? '' : 'none'; }
}

async function doLogout() {
  await sb.auth.signOut();
  state.data = { empresas: [], inversiones: [] };
  state.profile = null;
  state.esAdmin = false;
  state.role = 'socio';
  state.selectedId = null;
  showLogin();
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showLoginError('');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const submitBtn = document.getElementById('loginSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Ingresando...'; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showLoginError('Usuario o contraseña incorrectos.');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Ingresar'; }
    return;
  }
  await afterLogin();
});

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') showLogin();
});

(async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { await afterLogin(); }
  else { showLogin(); }
})();

  return error ? [] : (data || []);
}

async function renderAdminMain() {
  const main = document.getElementById('main');
  if (!main) return;
  main.innerHTML = '<div class="panel"><h2>Administración de usuarios</h2><p class="sub">Cargando...</p></div>';
  const users = await loadAdminUsers();
  const rows = users.map(u => `
    <tr>
      <td>${esc(u.email || '')}</td>
      <td>${esc(u.nombre || '')}</td>
      <td>
        <select data-uid="${esc(u.id)}" class="admin-role-select">
          <option value="socio" ${u.rol === 'socio' ? 'selected' : ''}>Socio/Gerente</option>
          <option value="auditor" ${u.rol === 'auditor' ? 'selected' : ''}>Auditor</option>
        </select>
      </td>
      <td>
        <label><input type="checkbox" class="admin-esadmin-check" data-uid="${esc(u.id)}" ${u.es_admin ? 'checked' : ''}> Admin</label>
      </td>
    </tr>`).join('');
  main.innerHTML = `
    <div class="panel">
      <h2>Administración de usuarios</h2>
      <p class="sub">Gestioná quién puede ver cada empresa y quién tiene permisos de edición.</p>
      <table class="hist">
        <thead><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Admin</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4">Sin usuarios.</td></tr>'}</tbody>
      </table>
      <h3 style="margin-top:24px;">Crear nuevo usuario</h3>
      <form id="adminCreateUserForm" class="login-box" style="max-width:360px;">
        <div class="field"><label>Nombre</label><input type="text" id="newUserNombre" required></div>
        <div class="field"><label>Email</label><input type="email" id="newUserEmail" required></div>
        <div class="field"><label>Contraseña provisoria</label><input type="password" id="newUserPassword" required minlength="6"></div>
        <div class="field"><label>Rol</label>
          <select id="newUserRol">
            <option value="socio">Socio/Gerente</option>
            <option value="auditor">Auditor</option>
          </select>
        </div>
        <button type="submit" class="primary">Crear usuario</button>
        <div id="newUserError" class="login-error" style="display:none;"></div>
      </form>
    </div>`;

  main.querySelectorAll('.admin-role-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const uid_ = sel.dataset.uid;
      const { error } = await sb.from('profiles').update({ rol: sel.value }).eq('id', uid_);
      if (error) alert('No se pudo actualizar el rol: ' + error.message);
    });
  });
  main.querySelectorAll('.admin-esadmin-check').forEach(chk => {
    chk.addEventListener('change', async () => {
      const uid_ = chk.dataset.uid;
      const { error } = await sb.from('profiles').update({ es_admin: chk.checked }).eq('id', uid_);
      if (error) { alert('No se pudo actualizar: ' + error.message); chk.checked = !chk.checked; }
    });
  });

  const createForm = document.getElementById('adminCreateUserForm');
  if (createForm) {
    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('newUserError');
      errEl.style.display = 'none';
      const nombre = document.getElementById('newUserNombre').value.trim();
      const email = document.getElementById('newUserEmail').value.trim();
      const password = document.getElementById('newUserPassword').value;
      const rol = document.getElementById('newUserRol').value;
      const submitBtn = createForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Creando...';
      try {
        const { data: { session } } = await sb.auth.getSession();
        const resp = await fetch(SUPABASE_URL + '/functions/v1/admin-create-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body: JSON.stringify({ nombre, email, password, rol })
        });
        const json = await resp.json();
        if (!resp.ok) throw new Error(json.error || 'Error desconocido');
        renderAdminMain();
      } catch (err) {
        errEl.textContent = 'No se pudo crear el usuario: ' + err.message;
        errEl.style.display = '';

    });
  }
}
